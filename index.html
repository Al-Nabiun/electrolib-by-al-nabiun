    function App() {

      const [adminAuth, setAdminAuth] = useState(false);
      const [pinoutOrientation, setPinoutOrientation] = useState('top'); // 'top' or 'bottom'
      const [notification, setNotification] = useState('');
      const [calculatorTab, setCalculatorTab] = useState('ohm'); // 'ohm', 'resistor', 'led', 'divider', 'colorcode', 'transformer'

      // --- RESISTOR COLOR CODE STATE ---
      const [resBandCount, setResBandCount] = useState(4); // 4, 5, 6
      const [band1, setBand1] = useState('brown');
      const [band2, setBand2] = useState('black');
      const [band3, setBand3] = useState('red'); // used for 5 and 6 band
      const [bandMultiplier, setBandMultiplier] = useState('red');
      const [bandTolerance, setBandTolerance] = useState('gold');
      const [bandTempCoeff, setBandTempCoeff] = useState('brown');

      // COLOR CODE DATA MAP
      const colorMap = {
        black: { digit: 0, mult: 1, tol: null, tc: 250, hex: '#1e293b', textHex: '#ffffff' },
        brown: { digit: 1, mult: 10, tol: 1, tc: 100, hex: '#78350f', textHex: '#ffffff' },
        red: { digit: 2, mult: 100, tol: 2, tc: 50, hex: '#dc2626', textHex: '#ffffff' },
        orange: { digit: 3, mult: 1000, tol: 0.05, tc: 15, hex: '#ea580c', textHex: '#ffffff' },
        yellow: { digit: 4, mult: 10000, tol: 0.02, tc: 25, hex: '#eab308', textHex: '#000000' },
        green: { digit: 5, mult: 100000, tol: 0.5, tc: 20, hex: '#16a34a', textHex: '#ffffff' },
        blue: { digit: 6, mult: 1000000, tol: 0.25, tc: 10, hex: '#2563eb', textHex: '#ffffff' },
        violet: { digit: 7, mult: 10000000, tol: 0.1, tc: 5, hex: '#9333ea', textHex: '#ffffff' },
        grey: { digit: 8, mult: 100000000, tol: 0.01, tc: 1, hex: '#475569', textHex: '#ffffff' },
        white: { digit: 9, mult: 1000000000, tol: null, tc: null, hex: '#f8fafc', textHex: '#000000' },
        gold: { digit: null, mult: 0.1, tol: 5, tc: null, hex: '#d97706', textHex: '#ffffff' },
        silver: { digit: null, mult: 0.01, tol: 10, tc: null, hex: '#94a3b8', textHex: '#000000' }
      };

      // CALCULATE RESISTOR VALUE
      const resistorResult = useMemo(() => {
        let val = 0;
        if (resBandCount === 4) {
          val = (colorMap[band1].digit * 10 + colorMap[band2].digit) * colorMap[bandMultiplier].mult;
        } else {
          val = (colorMap[band1].digit * 100 + colorMap[band2].digit * 10 + colorMap[band3].digit) * colorMap[bandMultiplier].mult;
        }

        const tolPct = colorMap[bandTolerance].tol || 5;
        const minVal = val * (1 - tolPct / 100);
        const maxVal = val * (1 + tolPct / 100);

        let formatted = `${val} Ω`;
        if (val >= 1000000) formatted = `${(val / 1000000).toFixed(2)} MΩ`;
        else if (val >= 1000) formatted = `${(val / 1000).toFixed(2)} kΩ`;

        let formattedMin = `${minVal.toFixed(1)} Ω`;
        if (minVal >= 1000000) formattedMin = `${(minVal / 1000000).toFixed(2)} MΩ`;
        else if (minVal >= 1000) formattedMin = `${(minVal / 1000).toFixed(2)} kΩ`;

        let formattedMax = `${maxVal.toFixed(1)} Ω`;
        if (maxVal >= 1000000) formattedMax = `${(maxVal / 1000000).toFixed(2)} MΩ`;
        else if (maxVal >= 1000) formattedMax = `${(maxVal / 1000).toFixed(2)} kΩ`;

        return {
          raw: val,
          formatted,
          tolerance: tolPct,
          minValFormatted: formattedMin,
          maxValFormatted: formattedMax,
          tempCoeff: resBandCount === 6 ? colorMap[bandTempCoeff].tc : null
        };
      }, [resBandCount, band1, band2, band3, bandMultiplier, bandTolerance, bandTempCoeff]);

      // --- TRANSFORMER CALCULATOR STATE ---
      const [txPrimaryV, setTxPrimaryV] = useState(220);
      const [txSecondaryV, setTxSecondaryV] = useState(12);
      const [txCoreArea, setTxCoreArea] = useState(6.25); // cm^2
      const [txFreq, setTxFreq] = useState(50); // Hz
      const [txFluxDensity, setTxFluxDensity] = useState(1.2); // Tesla

      const transformerResult = useMemo(() => {
        const v1 = parseFloat(txPrimaryV) || 0;
        const v2 = parseFloat(txSecondaryV) || 0;
        const area = parseFloat(txCoreArea) || 0;
        const f = parseFloat(txFreq) || 50;
        const b = parseFloat(txFluxDensity) || 1.2;

        if (v1 <= 0 || v2 <= 0 || area <= 0) return null;

        // Formula: Turns Per Volt (TPV) = 1 / (4.44 * f * B * Area_m2)
        // Area in cm^2 -> Area_m2 = area / 10000
        const areaM2 = area / 10000;
        const tpv = 1 / (4.44 * f * b * areaM2);
        
        const n1 = Math.round(v1 * tpv);
        const n2Base = v2 * tpv;
        const n2Compensated = Math.round(n2Base * 1.05); // +5% for copper loss compensation
        const ratio = (v1 / v2).toFixed(2);

        // Power handling estimate based on core area: Power (VA) ≈ (Area_cm2 / 1.15)^2
        const estimatedPowerVA = Math.pow(area / 1.15, 2);
        const ip = (estimatedPowerVA / v1).toFixed(2);
        const is = (estimatedPowerVA / v2).toFixed(2);

        return {
          tpv: tpv.toFixed(2),
          n1,
          n2Compensated,
          ratio,
          estimatedPowerVA: estimatedPowerVA.toFixed(1),
          ip,
          is
        };
      }, [txPrimaryV, txSecondaryV, txCoreArea, txFreq, txFluxDensity]);

        }
      };

          <header className="sticky top-0 z-50 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800">
            <div className="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between font-mono">
              <div className="flex items-center gap-3 cursor-pointer" onClick={() => setActiveTab('catalog')}>
                <div className="bg-brand-600 text-white p-2 rounded-xl">
                  <i data-lucide="cpu" className="w-5 h-5"></i>
                </div>
                <div>
                  <span className="font-extrabold text-base tracking-tight text-slate-900 dark:text-white">ElectroLib</span>
                  <span className="text-[10px] block text-brand-500 font-medium">by Al-Nabiun</span>
                </div>
              </div>

              {/* DESKTOP NAV */}

                <button onClick={() => setActiveTab('calculators')} className={`px-3 py-2 rounded-lg transition ${activeTab === 'calculators' ? 'bg-brand-500/10 text-brand-500' : 'text-slate-400 hover:text-slate-200'}`}>

                <button onClick={() => setActiveTab('compare')} className={`px-3 py-2 rounded-lg transition ${activeTab === 'compare' ? 'bg-brand-500/10 text-brand-500' : 'text-slate-400 hover:text-slate-200'}`}>

                      className="w-full bg-white dark:bg-slate-900 px-3 py-2.5 rounded-xl border border-slate-200 dark:border-slate-800 text-slate-900 dark:text-white"
                    >
                      {packages.map(p => <option key={p} value={p}>Package: {p}</option>)}
                    </select>
                  </div>
                </div>

                {/* COMPONENT CARDS GRID */}
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                  {filteredComponents.map(item => (
                    <div
                      key={item.id}
                      className="bg-white dark:bg-slate-900 rounded-2xl p-5 border border-slate-200 dark:border-slate-800 hover:border-brand-500/50 transition duration-200 flex flex-col justify-between space-y-4 group"
                    >
                      <div className="space-y-3">
                        <div className="flex items-start justify-between">
                          <div>
                            <span className="text-[10px] font-mono px-2 py-0.5 rounded bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400">
                              {item.category}
                            </span>
                            <h3 className="text-lg font-mono font-bold text-slate-900 dark:text-white mt-1 group-hover:text-brand-500 transition">
                              {item.partNumber}
                            </h3>
                          </div>
                          <span className="text-[10px] font-mono px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                            {item.status}
                          </span>
                        </div>

                        <p className="text-xs text-slate-500 dark:text-slate-400 line-clamp-2">{item.name}</p>

                        <div className="flex flex-wrap gap-1 font-mono text-[10px]">
                          <span className="bg-slate-100 dark:bg-slate-800 px-2 py-0.5 rounded text-slate-600 dark:text-slate-400">Pkg: {item.package}</span>
                          <span className="bg-slate-100 dark:bg-slate-800 px-2 py-0.5 rounded text-slate-600 dark:text-slate-400">Pins: {item.pinsCount}</span>
                        </div>
                      </div>

                      <div className="pt-3 border-t border-slate-100 dark:border-slate-800 flex items-center gap-2 font-mono text-xs">
                        <button
                          onClick={() => {
                            setSelectedComponentId(item.id);
                            setActiveTab('detail');
                          }}
                          className="flex-1 bg-brand-600 hover:bg-brand-700 text-white py-2 rounded-lg font-semibold transition"
                        >
                          View Specs
                        </button>
                        <button
                          onClick={() => toggleCompare(item.id)}
                          className={`p-2 rounded-lg border transition ${compareList.includes(item.id) ? 'border-brand-500 bg-brand-500/10 text-brand-500' : 'border-slate-200 dark:border-slate-800 text-slate-400 hover:bg-slate-800'}`}
                        >
                          <i data-lucide="columns" className="w-4 h-4"></i>
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* VIEW 2: COMPONENT DETAIL VIEW */}
            {activeTab === 'detail' && (
              <div className="space-y-6">
                <button
                  onClick={() => setActiveTab('catalog')}
                  className="font-mono text-xs text-brand-500 hover:underline flex items-center gap-1"
                >
                  <i data-lucide="arrow-left" className="w-4 h-4"></i> Back to Catalog
                </button>

                <div className="bg-white dark:bg-slate-900 rounded-2xl p-6 border border-slate-200 dark:border-slate-800 space-y-6">
                  {/* DETAIL HEADER */}
                  <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-slate-200 dark:border-slate-800 pb-6">
                    <div>
                      <div className="flex items-center gap-2 font-mono text-xs text-slate-400">
                        <span>{currentComponent.category}</span>
                        <span>•</span>
                        <span>{currentComponent.manufacturer}</span>
                      </div>
                      <h1 className="text-3xl font-bold font-mono text-slate-900 dark:text-white mt-1">
                        {currentComponent.partNumber}
                      </h1>
                      <p className="text-xs text-slate-400 mt-1 max-w-2xl">{currentComponent.name}</p>
                    </div>

                    <a
                      href={currentComponent.datasheetUrl}
                      target="_blank"
                      rel="noreferrer"
                      className="bg-brand-600 hover:bg-brand-700 text-white font-mono text-xs px-4 py-2.5 rounded-xl flex items-center gap-2 self-start md:self-auto"
                    >
                      <i data-lucide="file-text" className="w-4 h-4"></i> Official Datasheet PDF
                    </a>
                  </div>

                  {/* PINOUT & SPECS GRID */}
                  <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    {/* PINOUT TABLE */}
                    <div className="space-y-3 font-mono">
                      <div className="flex items-center justify-between">
                        <h2 className="text-sm font-bold text-slate-900 dark:text-white uppercase tracking-wider">Pin Configuration</h2>
                        <div className="flex bg-slate-100 dark:bg-slate-800 p-0.5 rounded-lg text-[10px]">
                          <button
                            onClick={() => setPinoutOrientation('top')}
                            className={`px-2 py-1 rounded ${pinoutOrientation === 'top' ? 'bg-brand-600 text-white' : 'text-slate-400'}`}
                          >
                            Top View
                          </button>
                          <button
                            onClick={() => setPinoutOrientation('bottom')}
                            className={`px-2 py-1 rounded ${pinoutOrientation === 'bottom' ? 'bg-brand-600 text-white' : 'text-slate-400'}`}
                          >
                            Bottom View
                          </button>
                        </div>
                      </div>

                      <div className="overflow-x-auto border border-slate-200 dark:border-slate-800 rounded-xl">
                        <table className="w-full text-xs">
                          <thead className="bg-slate-100 dark:bg-slate-800 text-slate-400 border-b border-slate-200 dark:border-slate-800">
                            <tr>
                              <th className="p-2.5 text-left">Pin #</th>
                              <th className="p-2.5 text-left">Name</th>
                              <th className="p-2.5 text-left">Label</th>
                              <th className="p-2.5 text-left">Notes</th>
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
                            {currentComponent.pins.map(p => (
                              <tr key={p.number} className="hover:bg-slate-50 dark:hover:bg-slate-800/50">
                                <td className="p-2.5 font-bold text-brand-500">{p.number}</td>
                                <td className="p-2.5 font-bold text-slate-900 dark:text-white">{p.name}</td>
                                <td className="p-2.5 text-slate-400">{p.label}</td>
                                <td className="p-2.5 text-slate-500 text-[11px]">{p.notes}</td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    </div>

                    {/* SPECS TABLE */}
                    <div className="space-y-3 font-mono">
                      <h2 className="text-sm font-bold text-slate-900 dark:text-white uppercase tracking-wider">Electrical Specifications</h2>
                      <div className="border border-slate-200 dark:border-slate-800 rounded-xl overflow-hidden">
                        <table className="w-full text-xs">
                          <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
                            {Object.entries(currentComponent.specs).map(([key, val]) => (
                              <tr key={key}>
                                <td className="p-2.5 font-semibold text-slate-400 capitalize bg-slate-50 dark:bg-slate-800/30 w-1/2">
                                  {key.replace(/([A-Z])/g, ' $1').trim()}
                                </td>
                                <td className="p-2.5 font-bold text-slate-900 dark:text-white">{val}</td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* VIEW 3: ELECTRONICS CALCULATORS */}
            {activeTab === 'calculators' && (
              <div className="space-y-6">
                <div className="border-b border-slate-200 dark:border-slate-800 pb-4">
                  <h1 className="text-2xl font-bold font-mono">Engineering Calculators Suite</h1>
                  <p className="text-xs text-slate-500">Precision electronic solvers with dynamic calculations and unit conversions.</p>
                </div>

                <div className="flex border-b border-slate-200 dark:border-slate-800 gap-2 overflow-x-auto text-xs font-mono">
                  <button onClick={() => setCalculatorTab('ohm')} className={`pb-2 px-3 whitespace-nowrap ${calculatorTab === 'ohm' ? 'border-b-2 border-brand-500 text-brand-500 font-bold' : 'text-slate-400'}`}>Ohm's Law</button>
                  <button onClick={() => setCalculatorTab('colorcode')} className={`pb-2 px-3 whitespace-nowrap ${calculatorTab === 'colorcode' ? 'border-b-2 border-brand-500 text-brand-500 font-bold' : 'text-slate-400'}`}>Resistor Color Code</button>
                  <button onClick={() => setCalculatorTab('drop')} className={`pb-2 px-3 whitespace-nowrap ${calculatorTab === 'drop' ? 'border-b-2 border-brand-500 text-brand-500 font-bold' : 'text-slate-400'}`}>Voltage Drop / Step Resistor</button>
                  <button onClick={() => setCalculatorTab('transformer')} className={`pb-2 px-3 whitespace-nowrap ${calculatorTab === 'transformer' ? 'border-b-2 border-brand-500 text-brand-500 font-bold' : 'text-slate-400'}`}>Transformer Winding / Turns</button>
                  <button onClick={() => setCalculatorTab('led')} className={`pb-2 px-3 whitespace-nowrap ${calculatorTab === 'led' ? 'border-b-2 border-brand-500 text-brand-500 font-bold' : 'text-slate-400'}`}>LED Series Resistor</button>
                  <button onClick={() => setCalculatorTab('divider')} className={`pb-2 px-3 whitespace-nowrap ${calculatorTab === 'divider' ? 'border-b-2 border-brand-500 text-brand-500 font-bold' : 'text-slate-400'}`}>Voltage Divider</button>
                </div>

                {/* CALCULATOR 1: OHM'S LAW */}
                {calculatorTab === 'ohm' && (
                  <div className="bg-white dark:bg-slate-900 p-6 rounded-2xl border border-slate-200 dark:border-slate-800 max-w-xl space-y-4">
                    <h2 className="font-mono font-bold text-base text-brand-500">Ohm's Law & Power Solver</h2>
                    <div className="grid grid-cols-2 gap-3 font-mono text-xs">
                      <div>
                        <label className="text-slate-400">Voltage (V)</label>
                        <input id="calc-v" type="number" placeholder="5" className="w-full bg-slate-100 dark:bg-slate-800 p-2 rounded border border-slate-700 mt-1" />
                      </div>
                      <div>
                        <label className="text-slate-400">Resistance (Ω)</label>
                        <input id="calc-r" type="number" placeholder="220" className="w-full bg-slate-100 dark:bg-slate-800 p-2 rounded border border-slate-700 mt-1" />
                      </div>
                    </div>
                    <button
                      onClick={() => {
                        const v = parseFloat(document.getElementById('calc-v').value);
                        const r = parseFloat(document.getElementById('calc-r').value);
                        if (v && r) {
                          const i = v / r;
                          const p = v * i;
                          notify(`Current (I): ${(i*1000).toFixed(2)} mA | Power (P): ${p.toFixed(3)} W`);
                        }
                      }}
                      className="w-full bg-brand-600 hover:bg-brand-700 text-white text-xs font-mono py-2 rounded-lg"
                    >
                      Calculate Current & Power
                    </button>
                  </div>
                )}

                {/* CALCULATOR 2: RESISTOR COLOR CODE */}
                {calculatorTab === 'colorcode' && (
                  <div className="bg-white dark:bg-slate-900 p-6 rounded-2xl border border-slate-200 dark:border-slate-800 space-y-6 max-w-3xl">
                    <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-slate-100 dark:border-slate-800 pb-4">
                      <div>
                        <h2 className="font-mono font-bold text-lg text-brand-500">Resistor Color Code Calculator (রেজিস্টরের কালার কোড)</h2>
                        <p className="text-xs text-slate-400">Select band colors to calculate accurate resistance and tolerance values.</p>
                      </div>
                      <div className="flex bg-slate-100 dark:bg-slate-800 p-1 rounded-lg text-xs font-mono">
                        {[4, 5, 6].map(b => (
                          <button
                            key={b}
                            onClick={() => setResBandCount(b)}
                            className={`px-3 py-1 rounded ${resBandCount === b ? 'bg-brand-600 text-white font-bold' : 'text-slate-400'}`}
                          >
                            {b} Bands
                          </button>
                        ))}
                      </div>
                    </div>

                    {/* DYNAMIC RESISTOR SVG */}
                    <div className="bg-slate-950 p-6 rounded-xl border border-slate-800 flex flex-col items-center justify-center space-y-3">
                      <svg className="w-full max-w-md h-24" viewBox="0 0 320 80">
                        {/* Leads */}
                        <line x1="0" y1="40" x2="60" y2="40" stroke="#94a3b8" strokeWidth="6" strokeLinecap="round" />
                        <line x1="260" y1="40" x2="320" y2="40" stroke="#94a3b8" strokeWidth="6" strokeLinecap="round" />
                        {/* Body */}
                        <path d="M 60 20 Q 80 15 100 20 L 220 20 Q 240 15 260 20 L 260 60 Q 240 65 220 60 L 100 60 Q 80 65 60 60 Z" fill="#f1f5f9" stroke="#cbd5e1" strokeWidth="2" />
                        
                        {/* Band 1 */}
                        <rect x="85" y="17" width="12" height="46" fill={colorMap[band1].hex} rx="1" />
                        {/* Band 2 */}
                        <rect x="115" y="18" width="12" height="44" fill={colorMap[band2].hex} rx="1" />
                        
                        {/* Band 3 (5/6 Bands) */}
                        {resBandCount >= 5 && (
                          <rect x="145" y="18" width="12" height="44" fill={colorMap[band3].hex} rx="1" />
                        )}

                        {/* Multiplier Band */}
                        <rect x={resBandCount >= 5 ? 175 : 155} y="18" width="12" height="44" fill={colorMap[bandMultiplier].hex} rx="1" />
                        
                        {/* Tolerance Band */}
                        <rect x={resBandCount >= 5 ? 205 : 195} y="18" width="12" height="44" fill={colorMap[bandTolerance].hex} rx="1" />

                        {/* Temp Coeff Band (6 Bands) */}
                        {resBandCount === 6 && (
                          <rect x="230" y="17" width="12" height="46" fill={colorMap[bandTempCoeff].hex} rx="1" />
                        )}
                      </svg>

                      {/* DISPLAY RESULT */}
                      <div className="text-center font-mono">
                        <div className="text-3xl font-extrabold text-brand-400">{resistorResult.formatted}</div>
                        <div className="text-xs text-slate-400 mt-1">
                          Tolerance: <span className="text-amber-400 font-bold">±{resistorResult.tolerance}%</span> ({resistorResult.minValFormatted} - {resistorResult.maxValFormatted})
                          {resistorResult.tempCoeff && (
                            <span className="ml-3 text-cyan-400">Temp Coeff: {resistorResult.tempCoeff} ppm/K</span>
                          )}
                        </div>
                      </div>
                    </div>

                    {/* BAND SELECTORS GRID */}
                    <div className="grid grid-cols-2 md:grid-cols-3 gap-3 font-mono text-xs">
                      <div>
                        <label className="text-slate-400 font-bold block mb-1">1st Digit Band</label>
                        <select value={band1} onChange={e => setBand1(e.target.value)} className="w-full bg-slate-100 dark:bg-slate-800 p-2 rounded border border-slate-700">
                          {Object.keys(colorMap).filter(c => colorMap[c].digit !== null).map(c => (
                            <option key={c} value={c}>{c.toUpperCase()} ({colorMap[c].digit})</option>
                          ))}
                        </select>
                      </div>

                      <div>
                        <label className="text-slate-400 font-bold block mb-1">2nd Digit Band</label>
                        <select value={band2} onChange={e => setBand2(e.target.value)} className="w-full bg-slate-100 dark:bg-slate-800 p-2 rounded border border-slate-700">
                          {Object.keys(colorMap).filter(c => colorMap[c].digit !== null).map(c => (
                            <option key={c} value={c}>{c.toUpperCase()} ({colorMap[c].digit})</option>
                          ))}
                        </select>
                      </div>

                      {resBandCount >= 5 && (
                        <div>
                          <label className="text-slate-400 font-bold block mb-1">3rd Digit Band</label>
                          <select value={band3} onChange={e => setBand3(e.target.value)} className="w-full bg-slate-100 dark:bg-slate-800 p-2 rounded border border-slate-700">
                            {Object.keys(colorMap).filter(c => colorMap[c].digit !== null).map(c => (
                              <option key={c} value={c}>{c.toUpperCase()} ({colorMap[c].digit})</option>
                            ))}
                          </select>
                        </div>
                      )}

                      <div>
                        <label className="text-slate-400 font-bold block mb-1">Multiplier Band</label>
                        <select value={bandMultiplier} onChange={e => setBandMultiplier(e.target.value)} className="w-full bg-slate-100 dark:bg-slate-800 p-2 rounded border border-slate-700">
                          {Object.keys(colorMap).map(c => (
                            <option key={c} value={c}>{c.toUpperCase()} (x{colorMap[c].mult})</option>
                          ))}
                        </select>
                      </div>

                      <div>
                        <label className="text-slate-400 font-bold block mb-1">Tolerance Band</label>
                        <select value={bandTolerance} onChange={e => setBandTolerance(e.target.value)} className="w-full bg-slate-100 dark:bg-slate-800 p-2 rounded border border-slate-700">
                          {Object.keys(colorMap).filter(c => colorMap[c].tol !== null).map(c => (
                            <option key={c} value={c}>{c.toUpperCase()} (±{colorMap[c].tol}%)</option>
                          ))}
                        </select>
                      </div>

                      {resBandCount === 6 && (
                        <div>
                          <label className="text-slate-400 font-bold block mb-1">Temp Coeff (ppm/K)</label>
                          <select value={bandTempCoeff} onChange={e => setBandTempCoeff(e.target.value)} className="w-full bg-slate-100 dark:bg-slate-800 p-2 rounded border border-slate-700">
                            {Object.keys(colorMap).filter(c => colorMap[c].tc !== null).map(c => (
                              <option key={c} value={c}>{c.toUpperCase()} ({colorMap[c].tc} ppm/K)</option>
                            ))}
                          </select>
                        </div>
                      )}
                    </div>
                  </div>
                )}

                {/* CALCULATOR 3: VOLTAGE STEPPING / DROPPING RESISTOR */}
                {calculatorTab === 'drop' && (
                  <div className="bg-white dark:bg-slate-900 p-6 rounded-2xl border border-slate-200 dark:border-slate-800 space-y-5 max-w-2xl font-mono">
                    <div>
                      <h2 className="font-bold text-lg text-brand-500">Voltage Drop & Load Resistor Calculator (ভোল্টেজ ড্রপ রেজিস্টর)</h2>
                      <p className="text-xs text-slate-400">Determine series resistor value required to power 3.3V, 5V, or custom devices from higher supply voltages (6V, 9V, 12V, 24V, 48V).</p>
                    </div>

                    {/* PRESET BUTTONS */}
                    <div className="space-y-2">
                      <span className="text-xs text-slate-400 font-bold">Quick Supply Presets (সোর্স ভোল্টেজ নির্বাচন):</span>
                      <div className="flex flex-wrap gap-2 text-xs">
                        {[6, 9, 12, 24, 48].map(v => (
                          <button
                            key={v}
                            onClick={() => {
                              document.getElementById('drop-vin').value = v;
                            }}
                            className="bg-slate-100 dark:bg-slate-800 hover:bg-brand-600 hover:text-white px-3 py-1 rounded border border-slate-700 transition"
                          >
                            {v}V Supply
                          </button>
                        ))}
                      </div>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 text-xs">
                      <div>
                        <label className="text-slate-400 block mb-1">Source Vin (V)</label>
                        <input id="drop-vin" type="number" defaultValue="12" className="w-full bg-slate-100 dark:bg-slate-800 p-2 rounded border border-slate-700" />
                      </div>
                      <div>
                        <label className="text-slate-400 block mb-1">Target Device Vout (V)</label>
                        <input id="drop-vout" type="number" defaultValue="5" className="w-full bg-slate-100 dark:bg-slate-800 p-2 rounded border border-slate-700" />
                      </div>
                      <div>
                        <label className="text-slate-400 block mb-1">Load Current (mA)</label>
                        <input id="drop-il" type="number" defaultValue="100" className="w-full bg-slate-100 dark:bg-slate-800 p-2 rounded border border-slate-700" />
                      </div>
                    </div>

                    <button
                      onClick={() => {
                        const vin = parseFloat(document.getElementById('drop-vin').value);
                        const vout = parseFloat(document.getElementById('drop-vout').value);
                        const ilMa = parseFloat(document.getElementById('drop-il').value);

                        if (vin <= vout) {
                          notify("Source Vin must be greater than Target Vout!");
                          return;
                        }
                        if (ilMa <= 0) {
                          notify("Current must be greater than 0 mA!");
                          return;
                        }

                        const iAmp = ilMa / 1000;
                        const vDrop = vin - vout;
                        const rExact = vDrop / iAmp;
                        const pWatt = vDrop * iAmp;

                        notify(`Resistor: ${rExact.toFixed(1)} Ω | Power Rating: ${pWatt.toFixed(2)} W ${pWatt > 0.25 ? '⚠️ High Wattage Resistor Required!' : '✅ Safe for 1/4W'}`);
                      }}
                      className="w-full bg-brand-600 hover:bg-brand-700 text-white py-2.5 rounded-lg font-bold"
                    >
                      Calculate Resistor & Power Rating
                    </button>

                    <div className="p-4 bg-slate-950 rounded-xl border border-slate-800 text-xs space-y-2">
                      <div className="text-slate-400 font-bold uppercase tracking-wider">Formula Used (সূত্র):</div>
                      <div className="text-brand-400 font-mono">R = (Vin - Vout) / I_load</div>
                      <div className="text-amber-400 font-mono">P_dissipation = (Vin - Vout) × I_load</div>
                      <div className="text-slate-500 text-[11px] leading-relaxed">
                        Note: Always choose a resistor with at least 2x the calculated wattage rating for thermal longevity and safety.
                      </div>
                    </div>
                  </div>
                )}

                {/* CALCULATOR 4: TRANSFORMER TURNS & WINDING */}
                {calculatorTab === 'transformer' && (
                  <div className="bg-white dark:bg-slate-900 p-6 rounded-2xl border border-slate-200 dark:border-slate-800 space-y-6 max-w-3xl font-mono">
                    <div>
                      <h2 className="font-bold text-lg text-brand-500">Transformer Turns Ratio & Winding Calculator (ট্রান্সফরমার প্যাচ / টার্নস)</h2>
                      <p className="text-xs text-slate-400">Calculate Turns Per Volt (TPV), Primary turns (N1), Secondary turns (N2 with loss compensation), and estimated power handling.</p>
                    </div>

                    <div className="grid grid-cols-2 sm:grid-cols-3 gap-3 text-xs">
                      <div>
                        <label className="text-slate-400 block mb-1">Primary Voltage V1 (V)</label>
                        <input type="number" value={txPrimaryV} onChange={e => setTxPrimaryV(e.target.value)} className="w-full bg-slate-100 dark:bg-slate-800 p-2 rounded border border-slate-700" />
                      </div>

                      <div>
                        <label className="text-slate-400 block mb-1">Secondary Voltage V2 (V)</label>
                        <input type="number" value={txSecondaryV} onChange={e => setTxSecondaryV(e.target.value)} className="w-full bg-slate-100 dark:bg-slate-800 p-2 rounded border border-slate-700" />
                      </div>

                      <div>
                        <label className="text-slate-400 block mb-1">Core Area (cm²)</label>
                        <input type="number" value={txCoreArea} onChange={e => setTxCoreArea(e.target.value)} className="w-full bg-slate-100 dark:bg-slate-800 p-2 rounded border border-slate-700" />
                      </div>

                      <div>
                        <label className="text-slate-400 block mb-1">Frequency (Hz)</label>
                        <input type="number" value={txFreq} onChange={e => setTxFreq(e.target.value)} className="w-full bg-slate-100 dark:bg-slate-800 p-2 rounded border border-slate-700" />
                      </div>

                      <div>
                        <label className="text-slate-400 block mb-1">Flux Density B (Tesla)</label>
                        <input type="number" step="0.1" value={txFluxDensity} onChange={e => setTxFluxDensity(e.target.value)} className="w-full bg-slate-100 dark:bg-slate-800 p-2 rounded border border-slate-700" />
                      </div>
                    </div>

                    {transformerResult && (
                      <div className="bg-slate-950 p-5 rounded-xl border border-slate-800 space-y-3 text-xs">
                        <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 text-center">
                          <div className="bg-slate-900 p-3 rounded-lg border border-slate-800">
                            <span className="text-slate-400 text-[10px] block">Turns Per Volt</span>
                            <span className="text-brand-400 font-extrabold text-lg">{transformerResult.tpv}</span>
                          </div>

                          <div className="bg-slate-900 p-3 rounded-lg border border-slate-800">
                            <span className="text-slate-400 text-[10px] block">Primary Turns (N1)</span>
                            <span className="text-emerald-400 font-extrabold text-lg">{transformerResult.n1} Turns</span>
                          </div>

                          <div className="bg-slate-900 p-3 rounded-lg border border-slate-800">
                            <span className="text-slate-400 text-[10px] block">Secondary Turns (+5%)</span>
                            <span className="text-amber-400 font-extrabold text-lg">{transformerResult.n2Compensated} Turns</span>
                          </div>

                          <div className="bg-slate-900 p-3 rounded-lg border border-slate-800">
                            <span className="text-slate-400 text-[10px] block">Estimated Power</span>
                            <span className="text-cyan-400 font-extrabold text-lg">{transformerResult.estimatedPowerVA} VA</span>
                          </div>
                        </div>

                        <div className="border-t border-slate-800 pt-3 text-slate-300 space-y-1">
                          <div>• Turns Ratio (N1 : N2): <span className="font-bold text-white">{transformerResult.ratio} : 1</span></div>
                          <div>• Full Load Primary Current (I1): <span className="font-bold text-white">{transformerResult.ip} A</span></div>
                          <div>• Full Load Secondary Current (I2): <span className="font-bold text-white">{transformerResult.is} A</span></div>
                        </div>
                      </div>
                    )}
                  </div>
                )}

                {/* CALCULATOR 5: LED SERIES RESISTOR */}
                {calculatorTab === 'led' && (
                  <div className="bg-white dark:bg-slate-900 p-6 rounded-2xl border border-slate-200 dark:border-slate-800 max-w-xl space-y-4">
                    <h2 className="font-mono font-bold text-base text-brand-500">LED Current-Limiting Resistor</h2>
                    <div className="grid grid-cols-3 gap-2 font-mono text-xs">
                      <div>
                        <label className="text-slate-400">Supply Vs (V)</label>
                        <input id="led-vs" type="number" defaultValue="5" className="w-full bg-slate-100 dark:bg-slate-800 p-2 rounded border border-slate-700 mt-1" />
                      </div>
                      <div>
                        <label className="text-slate-400">LED Vf (V)</label>
                        <input id="led-vf" type="number" defaultValue="2.0" className="w-full bg-slate-100 dark:bg-slate-800 p-2 rounded border border-slate-700 mt-1" />
                      </div>
                      <div>
                        <label className="text-slate-400">Current If (mA)</label>
                        <input id="led-if" type="number" defaultValue="20" className="w-full bg-slate-100 dark:bg-slate-800 p-2 rounded border border-slate-700 mt-1" />
                      </div>
                    </div>
                    <button
                      onClick={() => {
                        const vs = parseFloat(document.getElementById('led-vs').value);
                        const vf = parseFloat(document.getElementById('led-vf').value);
                        const ifMa = parseFloat(document.getElementById('led-if').value);
                        if (vs > vf && ifMa > 0) {
                          const r = (vs - vf) / (ifMa / 1000);
                          const p = Math.pow((ifMa / 1000), 2) * r;
                          notify(`Required Resistor: ${r.toFixed(1)} Ω | Min Rating: ${p.toFixed(3)} W`);
                        }
                      }}
                      className="w-full bg-brand-600 hover:bg-brand-700 text-white text-xs font-mono py-2 rounded-lg"
                    >
                      Calculate Resistor
                    </button>
                  </div>
                )}

                {/* CALCULATOR 6: VOLTAGE DIVIDER */}
                {calculatorTab === 'divider' && (
                  <div className="bg-white dark:bg-slate-900 p-6 rounded-2xl border border-slate-200 dark:border-slate-800 max-w-xl space-y-4">
                    <h2 className="font-mono font-bold text-base text-brand-500">Voltage Divider Calculator</h2>
                    <div className="grid grid-cols-3 gap-2 font-mono text-xs">
                      <div>
                        <label className="text-slate-400">Vin (V)</label>
                        <input id="div-vin" type="number" defaultValue="12" className="w-full bg-slate-100 dark:bg-slate-800 p-2 rounded border border-slate-700 mt-1" />
                      </div>
                      <div>
                        <label className="text-slate-400">R1 (Ω)</label>
                        <input id="div-r1" type="number" defaultValue="10000" className="w-full bg-slate-100 dark:bg-slate-800 p-2 rounded border border-slate-700 mt-1" />
                      </div>
                      <div>
                        <label className="text-slate-400">R2 (Ω)</label>
                        <input id="div-r2" type="number" defaultValue="4700" className="w-full bg-slate-100 dark:bg-slate-800 p-2 rounded border border-slate-700 mt-1" />
                      </div>
                    </div>
                    <button
                      onClick={() => {
                        const vin = parseFloat(document.getElementById('div-vin').value);
                        const r1 = parseFloat(document.getElementById('div-r1').value);
                        const r2 = parseFloat(document.getElementById('div-r2').value);
                        if (vin && r1 && r2) {
                          const vout = vin * (r2 / (r1 + r2));
                          notify(`Output Voltage (Vout): ${vout.toFixed(2)} V`);
                        }
                      }}
                      className="w-full bg-brand-600 hover:bg-brand-700 text-white text-xs font-mono py-2 rounded-lg"
                    >
                      Calculate Vout
                    </button>
                  </div>
                )}

              </div>
            )}

            {/* VIEW 4: COMPONENT COMPARISON */}
            {activeTab === 'compare' && (
              <div className="space-y-6">
                <div className="border-b border-slate-200 dark:border-slate-800 pb-4">
                  <h1 className="text-2xl font-bold font-mono">Component Comparison Matrix</h1>
                  <p className="text-xs text-slate-500">Compare up to 4 components side by side.</p>
                </div>

                <div className="overflow-x-auto">
                  <table className="w-full bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 font-mono text-xs">
                    <thead className="bg-slate-100 dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700">
                      <tr>
                        <th className="p-4 text-left w-48">Spec Parameter</th>
                        {compareList.map(id => {
                          const comp = components.find(c => c.id === id);
                          return (
                            <th key={id} className="p-4 text-left min-w-[180px]">
                              <div className="font-bold text-brand-500 text-sm">{comp?.partNumber}</div>
                              <div className="text-[10px] text-slate-400 font-normal">{comp?.category}</div>
                            </th>
                          );
                        })}
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
                      <tr>
                        <td className="p-4 font-bold text-slate-400">Package</td>
                        {compareList.map(id => <td key={id} className="p-4">{components.find(c => c.id === id)?.package}</td>)}
                      </tr>
                      <tr>
                        <td className="p-4 font-bold text-slate-400">Status</td>
                        {compareList.map(id => <td key={id} className="p-4 text-emerald-400">{components.find(c => c.id === id)?.status}</td>)}
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {/* VIEW 5: CIRCUIT LIBRARY */}
            {activeTab === 'circuits' && (
              <div className="space-y-6">
                <div className="border-b border-slate-200 dark:border-slate-800 pb-4">
                  <h1 className="text-2xl font-bold font-mono">Practical Circuit Library</h1>
                  <p className="text-xs text-slate-500">Tested reference circuits with bill of materials.</p>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                  {CIRCUIT_LIBRARY_DATA.map(circ => (
                    <div key={circ.id} className="bg-white dark:bg-slate-900 rounded-2xl p-5 border border-slate-200 dark:border-slate-800 shadow-sm space-y-4">
                      <div>
                        <span className="text-[10px] font-mono px-2 py-0.5 rounded bg-brand-500/10 text-brand-500 border border-brand-500/20 font-bold">
                          {circ.category}
                        </span>
                        <h3 className="text-base font-mono font-bold mt-2 text-slate-900 dark:text-white">{circ.title}</h3>
                        <p className="text-xs text-slate-400 mt-1">{circ.description}</p>
                      </div>

                      <div className="bg-slate-50 dark:bg-slate-950 p-3 rounded-lg border border-slate-100 dark:border-slate-800 font-mono text-[11px]">
                        <span className="text-slate-400 font-bold block mb-1">Formula:</span>
                        <span className="text-brand-400">{circ.formula}</span>
                      </div>

                      <button
                        onClick={() => {
                          setSelectedComponentId(circ.componentId);
                          setActiveTab('detail');
                        }}
                        className="w-full bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-xs font-mono py-2 rounded-lg transition"
                      >
                        View Related Part
                      </button>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* VIEW 6: ADMIN */}
            {activeTab === 'admin' && (
              <div className="space-y-6 max-w-2xl mx-auto">
                <div className="bg-white dark:bg-slate-900 p-6 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm space-y-4 font-mono text-xs">
                  <h2 className="font-bold text-base text-slate-900 dark:text-white flex items-center gap-2">
                    <i data-lucide="shield-check" className="w-5 h-5 text-brand-500"></i>
                    Admin Portal & Data Export
                  </h2>
                  <p className="text-slate-400">Export database entries or manage verified data status.</p>

                  <button
                    onClick={() => {
                      const jsonString = `data:text/json;charset=utf-8,${encodeURIComponent(JSON.stringify(components, null, 2))}`;
                      const downloadAnchor = document.createElement('a');
                      downloadAnchor.setAttribute("href", jsonString);
                      downloadAnchor.setAttribute("download", "electrolib_data.json");
                      document.body.appendChild(downloadAnchor);
                      downloadAnchor.click();
                      downloadAnchor.remove();
                      notify("Downloaded electrolib_data.json");
                    }}
                    className="bg-brand-600 hover:bg-brand-700 text-white px-4 py-2 rounded-lg font-bold"
                  >
                    Export Database (JSON)
                  </button>
                </div>
              </div>
            )}

            {/* VIEW 7: API DOCS */}
            {activeTab === 'docs' && (
              <div className="space-y-6 max-w-3xl mx-auto">
                <div className="bg-white dark:bg-slate-900 p-6 rounded-2xl border border-slate-200 dark:border-slate-800 font-mono text-xs space-y-3">
                  <h1 className="text-lg font-bold text-slate-900 dark:text-white">REST API Reference</h1>
                  <p className="text-slate-400">Endpoints provided by ElectroLib backend service.</p>
                  
                  <div className="p-3 bg-slate-950 rounded-lg border border-slate-800">
                    <span className="text-emerald-400 font-bold mr-2">GET</span>
                    <code>/api/v1/components</code>
                  </div>
                  <div className="p-3 bg-slate-950 rounded-lg border border-slate-800">
                    <span className="text-emerald-400 font-bold mr-2">GET</span>
                    <code>/api/v1/components/&lt;partNumber&gt;</code>
                  </div>
                </div>
              </div>
            )}

          </main>

          {/* FOOTER */}
          <footer className="mt-12 border-t border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 py-6 text-center font-mono text-xs text-slate-500">
            <div className="max-w-7xl mx-auto px-4 flex flex-col md:flex-row items-center justify-between gap-2">
              <div>ElectroLib Platform — Open-Source Electronics Database by Al-Nabiun</div>
              <div>MIT License • Built for Electronics Engineers</div>
            </div>
          </footer>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
